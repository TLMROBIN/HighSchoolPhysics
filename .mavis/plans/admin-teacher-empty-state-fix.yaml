           - **不渲染 phase2d-form-grid**(避免后续引用 assessment_id 字段)
           - 保留头部/侧边/科目切换/退出
         - 推荐加分支:`if assessment is None: render 早返回带"暂无测评"提示的 HTML` 或在 `assessments[0]` 那行用 `or {}` 兜底,**整体风格跟现有 teacher 端一致**
      5. 加单测:
         - `tests/test_teacher_empty_dashboard.py` 新文件,测零 assessment 教师登录 `/teacher` 返回 200 不报 500
