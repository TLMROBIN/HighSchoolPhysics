         ```
      9. 远端重启服务(nohup 方式,因为 sudo systemctl 无 tty):
         ```bash
         SSHPASS='yubinai1234' sshpass -e ssh yub@10.50.159.62 'kill 3823311 2>/dev/null; sleep 2; nohup .venv/bin/python -m highschoolphysics.server --host 0.0.0.0 --port 8765 --db data/school.sqlite3 > data/server-new.log 2>&1 & echo "new PID: $!"; sleep 3; ps aux | grep highschoolphysics | grep -v grep'
         ```
         记下新 PID,写到 deliverable.md
      10. 远端重跑 unittest 确认 server.py 改动不破坏:
