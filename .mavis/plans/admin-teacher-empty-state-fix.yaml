      远端服务:`nohup python3 -m highschoolphysics.server --host 0.0.0.0 --port 8765 --db data/school.sqlite3`,PID 3823311 监听 8765
      admin 密码:`yubin12345`

      ## 必做
      1. **先 cd 到项目根**:`cd /Users/binyu/Projects/HighSchoolPhysics` + `git status` 确认是 git 仓库(刚 init 过,HEAD=1216ebb)
      2. 读 `highschoolphysics/server.py:1030-1100` 看 `render_teacher_app` 整段,以及 `repository.py:3902-3964` 的 `teacher_dashboard`
      3. 修 `server.py:1034` 附近:`assessment = dashboard["assessments"][0] if dashboard["assessments"] else None`
      4. **整个 render_teacher_app 内部所有访问 `assessment[...]` 或 `assessment[.id]` 的地方都要判空**:
         - 如果 `assessment is None`,**不要 IndexError**,给空状态:
           - `assessments` 列表渲染空提示("还没有测评,先去组卷")
