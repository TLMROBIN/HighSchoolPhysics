         - 跑 `python3 -m unittest discover -s tests -v` 必须全过,**且测试列表里能看到新加的 test_teacher_empty_dashboard**
      6. **本地改完先 git commit**:`git add -A && git -c user.email=mavis@local -c user.name=mavis commit -m "fix: render_teacher_app graceful empty state when teacher has 0 assessments"`
      7. 改完后**必须 scp 推送到远端**:
         ```bash
         SSHPASS='yubinai1234' sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
