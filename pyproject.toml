[project]
name = "highschoolphysics"
version = "0.1.0"
description = "Single-school high school physics knowledge graph and wrong-question-loop MVP"
requires-python = ">=3.9"

[project.optional-dependencies]
ocr = [
  "paddleocr>=3.0.0",
]
parsing = [
  "markitdown[docx,pdf]>=0.1.0",
  "mineru[all]>=2.0.0",
]
pdf = [
  "playwright>=1.40",
]
sso = [
  "Authlib>=1.3",
]
providers = [
  "cryptography>=42",
  "openai>=1.0",
]
production = [
  "paddleocr>=3.0.0",
  "markitdown[docx,pdf]>=0.1.0",
  "mineru[all]>=2.0.0",
  "playwright>=1.40",
  "Authlib>=1.3",
  "cryptography>=42",
  "openai>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["highschoolphysics*"]

[tool.highschoolphysics]
test = "python3 -m unittest discover -s tests -v"
run = "python3 -m highschoolphysics.server --host 127.0.0.1 --port 8765 --db data/highschoolphysics.sqlite3"
