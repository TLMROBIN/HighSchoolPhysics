[project]
name = "highschoolphysics"
version = "0.1.0"
description = "Single-school high school physics knowledge graph and wrong-question-loop MVP"
requires-python = ">=3.9"

[project.optional-dependencies]
ocr = [
  "paddleocr==3.7.0",
]
parsing = [
  "markitdown[docx,pdf]==0.1.6",
  "mineru[all]==3.4.0",
  "python-docx==1.2.0",
  "mammoth==1.11.0",
  "markdown-it-py==4.2.0",
]
pdf = [
  "playwright==1.60.0",
]
sso = [
  "Authlib>=1.3",
]
providers = [
  "cryptography>=42",
  "openai>=1.0",
]
production = [
  "paddleocr==3.7.0",
  "markitdown[docx,pdf]==0.1.6",
  "mineru[all]==3.4.0",
  "python-docx==1.2.0",
  "mammoth==1.11.0",
  "markdown-it-py==4.2.0",
  "playwright==1.60.0",
  "Authlib>=1.3",
  "cryptography>=42",
  "openai>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["highschoolphysics*"]

[tool.setuptools.package-data]
"highschoolphysics.document_adapters._vendor.mtef_py" = ["LICENSE", "NOTICE"]

[tool.highschoolphysics]
test = "python3 -m unittest discover -s tests -v"
run = "python3 -m highschoolphysics.server --host 127.0.0.1 --port 8765 --db data/highschoolphysics.sqlite3"
